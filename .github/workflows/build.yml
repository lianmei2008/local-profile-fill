name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager "build-tools;35.0.0" "platforms;android-35"

      - name: Build APK
        run: |
          if [ -f signing/local-test-signing.jks ]; then
            python3 build.py \
              --java-home "$JAVA_HOME" \
              --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
              --android-jar "$ANDROID_HOME/platforms/android-35/android.jar" \
              --work-dir build/work \
              --output dist/LocalProfileFill-1.1.0.apk \
              --key signing/local-test-signing.jks
          else
            python3 build.py \
              --java-home "$JAVA_HOME" \
              --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
              --android-jar "$ANDROID_HOME/platforms/android-35/android.jar" \
              --work-dir build/work \
              --output dist/LocalProfileFill-1.1.0.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalProfileFill-1.1.0
          path: |
            dist/LocalProfileFill-1.1.0.apk
            dist/LocalProfileFill-1.1.0.apk.sha256

      - name: Upload signing key (first run only)
        if: ${{ !hashFiles('signing/local-test-signing.jks') }}
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: build/work/local-test-signing.jks
